# Enrolment endpoint - PRIVATE ONLY.
# Listens on the hub address 10.40.1.10:443; reachable from the mine site through the VPN
# (NSG rule Allow-Site-Enroll). The name enroll.iot.example.com exists only in the
# private DNS zone. Only the enrolment routes are proxied; the internal API is not.

limit_req_zone $binary_remote_addr zone=iot_enroll:1m rate=30r/m;

server {
    listen 10.40.1.10:443 ssl;
    server_name enroll.iot.example.com;

    ssl_certificate     /etc/iot/tls/enroll.crt;
    ssl_certificate_key /etc/iot/tls/enroll.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 16k;
    access_log /var/log/nginx/iot-enroll.access.log;

    location ~ ^/v1/(enroll|reenroll|health)$ {
        limit_req zone=iot_enroll burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
