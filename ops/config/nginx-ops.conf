# Operator web app - the Azure Front Door origin.
# Port 80 is open only to the AzureFrontDoor.Backend service tag (NSG). nginx additionally
# rejects requests that do not carry THIS Front Door profile's ID (X-Azure-FDID), so other
# Front Door customers cannot reach the origin either. Operators sign in with basic auth.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/iot-ops.access.log;
    client_max_body_size 256k;

    # Front Door health probe - no authentication, no data.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/iot-fdid.conf;
        auth_basic "Contoso IoT Operations";
        auth_basic_user_file /etc/nginx/iot-ops.htpasswd;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
