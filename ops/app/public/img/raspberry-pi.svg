<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" role="img" aria-label="Raspberry Pi single board computer">
  <defs>
    <linearGradient id="pi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8f4e"/>
      <stop offset="1" stop-color="#1d6b39"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6eaee"/>
      <stop offset="1" stop-color="#9aa3ad"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="168" height="98" rx="7" fill="url(#pi)"/>

  <!-- mounting holes -->
  <g fill="#d8dde2" stroke="#7f8a93" stroke-width="1">
    <circle cx="27" cy="27" r="3.4"/><circle cx="173" cy="27" r="3.4"/>
    <circle cx="27" cy="103" r="3.4"/><circle cx="173" cy="103" r="3.4"/>
  </g>

  <!-- 40-pin GPIO header -->
  <rect x="38" y="21" width="104" height="11" rx="2" fill="#1a1d21"/>
  <g fill="#e0b64a">
    <rect x="42" y="23.5" width="2.6" height="2.6"/><rect x="48" y="23.5" width="2.6" height="2.6"/>
    <rect x="54" y="23.5" width="2.6" height="2.6"/><rect x="60" y="23.5" width="2.6" height="2.6"/>
    <rect x="66" y="23.5" width="2.6" height="2.6"/><rect x="72" y="23.5" width="2.6" height="2.6"/>
    <rect x="78" y="23.5" width="2.6" height="2.6"/><rect x="84" y="23.5" width="2.6" height="2.6"/>
    <rect x="90" y="23.5" width="2.6" height="2.6"/><rect x="96" y="23.5" width="2.6" height="2.6"/>
    <rect x="102" y="23.5" width="2.6" height="2.6"/><rect x="108" y="23.5" width="2.6" height="2.6"/>
    <rect x="114" y="23.5" width="2.6" height="2.6"/><rect x="120" y="23.5" width="2.6" height="2.6"/>
    <rect x="126" y="23.5" width="2.6" height="2.6"/><rect x="132" y="23.5" width="2.6" height="2.6"/>
    <rect x="42" y="27.5" width="2.6" height="2.6"/><rect x="48" y="27.5" width="2.6" height="2.6"/>
    <rect x="54" y="27.5" width="2.6" height="2.6"/><rect x="60" y="27.5" width="2.6" height="2.6"/>
    <rect x="66" y="27.5" width="2.6" height="2.6"/><rect x="72" y="27.5" width="2.6" height="2.6"/>
    <rect x="78" y="27.5" width="2.6" height="2.6"/><rect x="84" y="27.5" width="2.6" height="2.6"/>
    <rect x="90" y="27.5" width="2.6" height="2.6"/><rect x="96" y="27.5" width="2.6" height="2.6"/>
    <rect x="102" y="27.5" width="2.6" height="2.6"/><rect x="108" y="27.5" width="2.6" height="2.6"/>
    <rect x="114" y="27.5" width="2.6" height="2.6"/><rect x="120" y="27.5" width="2.6" height="2.6"/>
    <rect x="126" y="27.5" width="2.6" height="2.6"/><rect x="132" y="27.5" width="2.6" height="2.6"/>
  </g>

  <!-- SoC + RAM -->
  <rect x="70" y="52" width="34" height="30" rx="2.5" fill="#20242a"/>
  <text x="87" y="70" font-family="Segoe UI, Arial" font-size="8" font-weight="600"
        fill="#7f8a95" text-anchor="middle">SoC</text>
  <rect x="46" y="58" width="17" height="15" rx="2" fill="#2a2f36"/>

  <!-- USB stack + ethernet -->
  <rect x="146" y="40" width="34" height="24" rx="2" fill="url(#metal)" stroke="#79838d" stroke-width="1"/>
  <rect x="150" y="45" width="26" height="6" rx="1" fill="#2f3439"/>
  <rect x="150" y="54" width="26" height="6" rx="1" fill="#2f3439"/>
  <rect x="146" y="70" width="34" height="26" rx="2" fill="url(#metal)" stroke="#79838d" stroke-width="1"/>
  <rect x="151" y="76" width="24" height="14" rx="1.5" fill="#2f3439"/>
  <circle cx="156" cy="73" r="1.8" fill="#f0c23c"/>
  <circle cx="170" cy="73" r="1.8" fill="#4cd964"/>

  <!-- USB-C power + micro HDMI -->
  <rect x="24" y="86" width="16" height="9" rx="4" fill="#b6bec7" stroke="#79838d" stroke-width="1"/>
  <rect x="48" y="86" width="20" height="9" rx="2" fill="#b6bec7" stroke="#79838d" stroke-width="1"/>
  <rect x="76" y="86" width="20" height="9" rx="2" fill="#b6bec7" stroke="#79838d" stroke-width="1"/>

  <!-- status LEDs -->
  <circle cx="30" cy="45" r="2.6" fill="#e0483c"/>
  <circle cx="30" cy="52" r="2.6" fill="#4cd964"/>
</svg>
